```yaml
name: Netflix CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib flask

      - name: Train and evaluate Netflix model
        run: python train.py

      - name: Check generated model files
        run: |
          test -f artifacts/netflix_model.joblib
          test -f artifacts/label_encoder.joblib
          test -f artifacts/metrics.json
          echo "All model artifacts generated successfully"

      - name: Test Flask API
        run: |
          python -c "import app; client = app.app.test_client(); response = client.get('/'); print(response.status_code); assert response.status_code == 200"
          echo "Flask API test passed"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netflix-model-artifacts
          path: artifacts/
```